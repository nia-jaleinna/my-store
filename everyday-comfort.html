
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everyday Comfort Tee | KalapaTEE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/product-order.css">
</head>

<body>

<nav class="navbar navbar-expand-md nav-bgcolor border-bottom">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <img src="./logo-img/Primary.png" alt="KalapaTEE" class="navbar-logo">
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about-us.html">About Us</a></li>
                <li class="nav-item"><a class="nav-link active" href="shop.html">Shop</a></li>
                <li class="nav-item"><a class="nav-link" href="favorites.html">Favorites</a></li>
                <li class="nav-item"><a class="nav-link" href="privacy-and-terms.html">Privacy and Terms</a></li>
                <li class="nav-item"><a class="nav-link" href="settings.html">Settings</a></li>
                <li class="nav-item"><a class="nav-link" href="contact-us.html">Contact Us</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="order-page">

    <a href="shop.html" class="back-link">← Back to Shop</a>

    <div class="order-container">

        <div class="product-preview">
            <img src="images/EverydayComfortTee.png" alt="Everyday Comfort Tee">
        </div>

        <div class="order-details">

            <p class="eyebrow">KALAPATEE COLLECTION</p>

            <h1>Everyday Comfort Tee</h1>

            <p class="product-price">₱499.00</p>

            <p class="product-description">
                A plain, comfortable tee designed for everyday wear.
            </p>

            <form class="order-form"
                  data-product="Everyday Comfort Tee"
                  data-price="499"
                  data-image="images/EverydayComfortTee.png">

                <label for="size">Choose Size *</label>
                <select id="size" name="size" required>
                    <option value="">Select your size</option>
                    <option value="XS">XS</option>
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                    <option value="XXL">XXL</option>
                </select>

                <label for="quantity">Quantity *</label>
                <div class="quantity-control">
                    <button type="button" class="quantity-btn decrease">−</button>
                    <input type="number" id="quantity" name="quantity"
                           value="1" min="1" max="99" required>
                    <button type="button" class="quantity-btn increase">+</button>
                </div>

                <div class="total-row">
                    <span>Total Price</span>
                    <strong class="total-price">₱499.00</strong>
                </div>

                <hr>

                <h2>Customer Information</h2>

                <label for="customerName">Full Name *</label>
                <input type="text" id="customerName" name="customerName"
                       placeholder="Enter your full name" required>

                <label for="customerEmail">Email Address *</label>
                <input type="email" id="customerEmail" name="customerEmail"
                       placeholder="Enter your email" required>

                <label for="customerPhone">Contact Number *</label>
                <input type="tel" id="customerPhone" name="customerPhone"
                       placeholder="Enter your contact number" required>

                <label for="customerAddress">Delivery Address *</label>
                <textarea id="customerAddress" name="customerAddress"
                          rows="3" placeholder="Enter your complete delivery address"
                          required></textarea>

                <button type="submit" class="order-now-btn">
                    ORDER NOW →
                </button>

                <p class="form-status" role="status" aria-live="polite"></p>

            </form>

        </div>
    </div>
</main>

<footer class="site-footer">
    <div class="container footer-content">
        <div class="footer-brand">
            <img src="./logo-img/Primary (White).png"
                 alt="KalapaTEE Logo" class="footer-logo">
            <p>All Rights Reserved</p>
        </div>

        <a href="privacy-and-terms.html" class="footer-button">
            Privacy and Terms
        </a>
    </div>
</footer>

<script src="js/order-form.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
